spring:
  application:
    name: pr

  ai:
    openai:
      api-key: ${AI_API_KEY:placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.1

pr:
  review:
    l2-timeout-seconds: 60
    l3-timeout-seconds: 30
    sse-timeout-ms: 180000
    max-concurrent-files: 5
